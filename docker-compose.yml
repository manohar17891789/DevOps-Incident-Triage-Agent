services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: incidents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DATABASE_URL: postgresql+psycopg2://triage:triage@postgres:5432/incidents
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_AGENT_ITERATIONS: ${MAX_AGENT_ITERATIONS:-6}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
